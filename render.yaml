# Render Blueprint Specification
# Deploys Database, Backend, and Frontend all on Render for 100% Free.
# Docs: https://render.com/docs/blueprint-spec

databases:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database with pgvector (Free Tier on Render)
  # ---------------------------------------------------------------------------
  - name: docqa-db
    databaseName: ragdb
    user: raguser
    plan: free
    region: oregon

services:
  # ---------------------------------------------------------------------------
  # 2. FastAPI Backend (Free Web Service via Docker)
  # ---------------------------------------------------------------------------
  - type: web
    name: docqa-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: docqa-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # Enter your Google Gemini API Key in the Render UI
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a secure 32+ character secret
      - key: CORS_ORIGINS
        value: "https://*.onrender.com,http://localhost:3000"

  # ---------------------------------------------------------------------------
  # 3. React 19 Frontend (Free Static Site - 0s cold start, fast global CDN)
  # ---------------------------------------------------------------------------
  - type: static
    name: docqa-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://docqa-backend.onrender.com"
